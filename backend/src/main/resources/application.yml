server:
  port: 8082

spring:
  datasource:
    url: jdbc:h2:file:./data/blogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: blogcommunity2024secretkey1234567890
  expiration: 86400000

logging:
  level:
    com.example.blogcommunity: DEBUG
    org.hibernate.SQL: DEBUG